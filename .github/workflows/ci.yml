name: ci

# Campaign Studio CMS spike —— D5（2026-11-09）
# 三個 job 分開，一眼看出是哪一段紅：secret-scan（密鑰／個人路徑）、check（schema＋黃金對照：回放 snapshot、端到端 draft 與 gate_report 都要和存好的標準答案逐字相同）、unit（全部測試）。
# Actions 一律 pin 到 full commit SHA（SHA 取自 ai-tool-sandbox 同版）。
# runner 先用 ubuntu-latest（spike repo 在個人帳號，連不到公司 global-runner）；搬進 YahooTWEC 時改 runs-on 並加 setup-codeartifact-npm。
# D10（2026-11-17）：加 aem-verify——CP-32 三裝置顯示檢查。用 runner 內建的 Google Chrome（playwright-core channel:"chrome"），不另裝瀏覽器。
#   搬進公司 runner／容器時要確認映像檔有 Chrome，否則這個 job 會在「找不到瀏覽器」紅。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  PIPELINE_DIR: 2026-Claude-code-AI自動化創建活動頁 workflow/pipeline
  TZ: UTC # 刻意用 UTC：D4 抓到檔期換算吃時區的 bug，CI 要能再抓到同類問題

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node "$PIPELINE_DIR/tools/secret_scan.js" .

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}/2026-Claude-code-AI自動化創建活動頁 workflow/pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 2026-Claude-code-AI自動化創建活動頁 workflow/pipeline/package-lock.json
      - run: npm ci
      - run: npm run schema:check
      - run: npm run test:replay
      - run: npm run test:golden

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # D5 首跑：一個測試 spawn zsh 失敗後掛了 4 小時——job 層再加一道上限
    defaults:
      run:
        working-directory: ${{ github.workspace }}/2026-Claude-code-AI自動化創建活動頁 workflow/pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 2026-Claude-code-AI自動化創建活動頁 workflow/pipeline/package-lock.json
      - run: npm ci
      - run: npm test
      - name: npm audit（只報不擋；D5 先看清單）
        run: npm audit --audit-level=high || true

  aem-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ github.workspace }}/2026-Claude-code-AI自動化創建活動頁 workflow/pipeline
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 2026-Claude-code-AI自動化創建活動頁 workflow/pipeline/package-lock.json
      - run: npm ci
      - name: Chrome 版本（紅了先看這行有沒有印出來）
        run: google-chrome --version
      - name: CP-32：收尾 → 檢查 → 組 AEM 檔 → 桌機／平板／手機顯示檢查
        run: node tools/ci_aem_verify.js --out "$RUNNER_TEMP/aem"
      - name: 失敗時印顯示檢查報告
        if: failure()
        run: cat "$RUNNER_TEMP/aem/aem-verify.json" 2>/dev/null | head -c 6000 || true
